<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Colors｜長谷 玄武 (Genbu Hase)</title>
    <meta name="description" content="長谷 玄武 (Genbu Hase) のカラーパレット" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" />

    <script>
      (function () {
        try {
          var key = "my-colors-theme";
          var mode = localStorage.getItem(key) || "system";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;

          var resolved =
            mode === "dark" || (mode === "system" && dark) ? "dark" : "light";

          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
